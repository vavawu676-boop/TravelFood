<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <link rel="stylesheet" href="css/allcolors.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 1024px;
            margin-top: 50px;
            margin-bottom: 0;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 2px 2px 2px 2px #a85858;
            padding: 15px;
            overflow: hidden;
        }

        .demo {
            width: 32%;
            box-shadow: 2px 2px 1px 1px #727171;
            margin-top: 15px;
            float: left;
            margin-right: 1%;
        }

        .demo .logo {
            width: 100%;
            height: 220px;
            background-image: url(images/leather04.jpg);
        }

        @media screen and (max-width: 1024px) {
            .wrapper {
                width: 94%;
                padding: 15px;
            }

            .demo {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="display-1 fw-900 mytitle-01">地方美食餐廳列表</div>
    <!-- 給固定的架構讓程式去彈性處裡 -->
    <div class="wrapper" id="foodlist">
        <div class="demo">
            <div class="logo bg-img" style="background-image: url(images/leather03.jpg);"></div>
            <p class="mytitle-04">店家:xxx</p>
            <p class="mytitle-04">電話:XXXXX</p>
        </div>
    </div>
    <!-- 外部呼叫預先製作的JSON檔案 -->
    <script src="js/jQuery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>
    <script>
        console.log(food);
        food.forEach(function (item) {
            // 從CONSOLE.LOG先預覽，是否正確執行顯示
            // console.log(item.Name);
            // console.log(item.City);
            // console.log(item.Email);

            // 主要顯示內容:熟記排列方式 以及 顯示方式
            $("#foodlist").append('<div class="demo" id="foodlist"><div class="logo bg-img" style="background-image:url('+item.PicURL+');"></div><p class="mytitle-04">店家:'+item.Name+'</p><p class="mytitle-04">電話:'+item.Tel+'</p></div>');});
    </script>
</body>

</html>
